<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agente da Loja — Perplexity UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Barra Lateral estilo Perplexity -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 2v20M4.93 4.93l14.14 14.14M2 12h20M4.93 19.07L19.07 4.93"/>
            <circle cx="12" cy="12" r="3" fill="#191a1a"/>
          </svg>
          <span class="brand-name">agente<span>.loja</span></span>
        </div>

        <button type="button" class="new-thread-btn" onclick="document.getElementById('chat').innerHTML=''; document.getElementById('pergunta').focus();">
          <span>Novo Tópico</span>
          <kbd>Ctrl K</kbd>
        </button>

        <nav class="sidebar-nav">
          <a href="#" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            Início
          </a>
          <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            Catálogo
          </a>
          <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
            Pedidos
          </a>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <div class="status-badge">
          <span class="status-dot"></span>
          <span>Agente Online</span>
        </div>
      </div>
    </aside>

    <!-- Área Principal -->
    <main class="main-container">
      <div class="content-wrapper">
        <!-- Cabeçalho inicial (some automaticamente quando o chat começa) -->
        <header class="hero-header">
          <h1>Onde o atendimento começa</h1>
        </header>

        <!-- Container de mensagens original -->
        <div id="chat" aria-live="polite"></div>

        <!-- Caixa de entrada estilo Perplexity -->
        <div class="search-dock">
          <form id="form">
            <input id="pergunta" aria-label="Sua mensagem" placeholder="Pergunte qualquer coisa sobre produtos, estoque ou pedidos..." autocomplete="off" required>
            <div class="form-footer">
              <div class="form-badges">
                <span class="mode-pill active">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10H12V2z"/></svg>
                  Pro • Loja
                </span>
                <span class="mode-pill">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
                  Estoque
                </span>
              </div>
              <button id="enviar" type="submit" aria-label="Enviar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="19" x2="12" y2="5"></line>
                  <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
              </button>
            </div>
          </form>

          <!-- Sugestões rápidas na tela inicial -->
          <div class="suggestions">
            <button type="button" class="chip">Quais produtos estão em promoção?</button>
            <button type="button" class="chip">Verificar disponibilidade no estoque</button>
            <button type="button" class="chip">Qual o prazo de entrega?</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Atalho Ctrl+K e clique nas sugestões rápidas
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        document.getElementById('pergunta').focus();
      }
    });

    document.querySelectorAll('.chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        const input = document.getElementById('pergunta');
        input.value = chip.textContent;
        document.getElementById('form').requestSubmit();
      });
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
